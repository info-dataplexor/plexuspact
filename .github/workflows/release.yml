name: Release

on:
  push:
    tags: ["v*"]
  # A dry run: builds and packages every target without publishing, so the
  # matrix is proven before a tag is cut.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: plexuspact

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use MSVC host toolchain on Windows
        if: runner.os == 'Windows'
        run: rustup set default-host x86_64-pc-windows-msvc

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rust-toolchain.toml pins the exact compiler, and that pin overrides the
      # `stable` the step above installed targets for. Cross targets have to
      # be added to the pinned toolchain itself, or the musl and x86_64 macOS
      # builds fail with "can't find crate for `core`" (the v0.1.0 run did).
      - name: Add the target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p plexuspact-cli --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="${BIN_NAME}-v${version}-${{ matrix.target }}.tar.gz"
          staging="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$staging/"
          cp LICENSE NOTICE README.md "$staging/"
          tar -czf "$archive" -C "$staging" .
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $archive = "$env:BIN_NAME-v$version-${{ matrix.target }}.zip"
          $staging = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "staging")
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN_NAME.exe" $staging
          Copy-Item LICENSE, NOTICE, README.md $staging
          Compress-Archive -Path "$staging/*" -DestinationPath $archive
          Add-Content -Path $env:GITHUB_ENV -Value "ARCHIVE=$archive"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    name: publish signed GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
      id-token: write        # OIDC for keyless signing + provenance (NFR-10)
      attestations: write    # SLSA build provenance attestations
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          set -euo pipefail
          sha256sum plexuspact-* > SHA256SUMS
          cat SHA256SUMS

      # SLSA build provenance for every published archive (verify later with
      # `gh attestation verify <file> --repo info-dataplexor/plexuspact`).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "artifacts/plexuspact-*"

      # Keyless (Fulcio/Rekor) signature over the checksum manifest, so a
      # substituted SHA256SUMS is detectable (doc 03 §11). Verify with:
      #   cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
      #     --certificate-identity-regexp 'https://github.com/info-dataplexor/plexuspact/.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign SHA256SUMS (keyless)
        working-directory: artifacts
        run: cosign sign-blob --yes SHA256SUMS --bundle SHA256SUMS.sigstore.json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/plexuspact-*
            artifacts/SHA256SUMS
            artifacts/SHA256SUMS.sigstore.json
          draft: false
          generate_release_notes: true
