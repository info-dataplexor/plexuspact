[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    # TLS, reached only through `plexuspact push`.
    # `ring` is ISC/MIT for its own code and carries the OpenSSL licence for the
    # BoringSSL assembly it vendors; `webpki-roots` ships Mozilla's CA list under
    # the CDLA. Both are permissive and neither is copyleft.
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace crates reference each other by path (plus an explicit version so
# cargo-deny can resolve them); a bare path is not a wildcard we want to ban.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
