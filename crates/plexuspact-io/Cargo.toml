[package]
name = "plexuspact-io"
description = "Input abstraction: format sniffing and readers (CSV/Parquet/NDJSON/JSON/Excel/XML/fixed-width/stdin) with transparent decompression"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
plexuspact-contract = { workspace = true }
polars = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
flate2 = { workspace = true }
zstd = { workspace = true }
tempfile = { workspace = true }
chrono = { workspace = true }
# 0.36 is the first calamine on quick-xml 0.41 (RUSTSEC-2026-0194/0195 are
# fixed there); it sets the workspace MSRV at 1.88.
calamine = { version = "0.36", features = ["dates"] }
quick-xml = "0.41"

[dev-dependencies]
insta = { workspace = true }

[lints]
workspace = true
